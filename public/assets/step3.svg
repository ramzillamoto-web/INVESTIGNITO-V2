<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="340" rx="16" fill="#0c0c10"/>
  <rect x="1" y="1" width="598" height="338" rx="15" stroke="#26262e" stroke-width="2"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#181820" stroke-width="1"/>
