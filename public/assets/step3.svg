  </defs>
  <rect width="600" height="340" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Bureau stamp decoration -->
  <rect x="30" y="24" width="130" height="24" rx="4" fill="#3b82f615" stroke="#3b82f640"/>
  <text x="95" y="40" font-family="monospace" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle" letter-spacing="2">INVESTIGNITO</text>

  <!-- Central Graphic -->
  <circle cx="300" cy="140" r="54" fill="#14141c" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="152" font-family="monospace" font-size="34" fill="#3b82f6" text-anchor="middle">📄</text>

  <!-- Title and Subtitle -->
  <text x="300" y="235" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">BROWSE DOSSIER PAGES</text>
  <text x="300" y="265" font-family="monospace" font-size="12" fill="#8e8e9c" text-anchor="middle">Inspect suspects across 10 ledger pages</text>

  <rect x="250" y="295" width="100" height="6" rx="3" fill="#22222c"/>
