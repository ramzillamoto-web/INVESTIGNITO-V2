    <script>
      // Redirect top-level visits on live netlify.app to the Shopify store page,
      // EXCEPT when running as an installed home-screen app or on preview deploy URLs.
      try {
        var isStandalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        var host = window.location.hostname.toLowerCase();
        var isLiveNetlify = /\.netlify\.app$/.test(host) && host.indexOf('--') === -1;
        if (!isStandalone && window.self === window.top && isLiveNetlify) {
          window.location.replace('https://corexbooks.com/pages/investignito');
        }
      } catch (e) {
        // non-fatal
      }
    </script>
